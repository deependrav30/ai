apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
  
  - name: PostgreSQL
    type: postgres
    url: postgres:5432
    database: episodic_memory
    user: ai_agent
    secureJsonData:
      password: ai_agent_password
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 10
      connMaxLifetime: 14400
    editable: true
